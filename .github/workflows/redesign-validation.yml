name: GSK Laravel frontend validation

on:
  push:
    branches:
      - redesign/modern-customer-frontend
  pull_request:
    branches:
      - main
    paths:
      - 'resources/views/frontend/**'
      - 'public/frontend/**'
      - 'routes/**'
      - 'app/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/**'

jobs:
  blade-and-php:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            printf 'APP_NAME=GSK\nAPP_ENV=testing\nAPP_KEY=\nAPP_DEBUG=true\nAPP_URL=http://localhost\nDB_CONNECTION=sqlite\nDB_DATABASE=:memory:\nCACHE_STORE=array\nSESSION_DRIVER=array\nQUEUE_CONNECTION=sync\n' > .env
          fi
          php artisan key:generate
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Run Laravel tests
        run: php artisan test
